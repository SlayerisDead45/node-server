<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Contact - CleanFresh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            background: #111;
            color: #f0f0f0;
        }

        .navbar {
            background: #1a1a1a;
            padding: 15px 30px;
            display: flex;
            gap: 20px;
            align-items: center;
            border-bottom: 2px solid #c9a84c;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #c9a84c;
            margin-right: auto;
        }

        .navbar a {
            color: #c9a84c;
            text-decoration: none;
            font-size: 15px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .content {
            max-width: 700px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .content h1 {
            font-size: 36px;
            color: #c9a84c;
            margin-bottom: 20px;
        }

        .content p {
            font-size: 16px;
            color: #aaa;
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .info {
            background: #1a1a1a;
            border: 1px solid #c9a84c;
            border-radius: 10px;
            padding: 25px;
            margin-top: 20px;
        }

        .info p {
            margin-bottom: 12px;
        }

        .info span {
            color: #c9a84c;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <!-- navbar -->
    <nav class="navbar">
        <div class="logo"> CleanFresh</div>
        <a href="/home">Home</a>
        <a href="/about">About Us</a>
        <a href="/contact">Contact Us</a>
    </nav>
    <!-- main content -->
    <div class="content">
        <h1>Contact Us</h1>
        <p>Have a question or want to book a service? Reach out to us anytime.</p>
        <!-- contact info box -->
        <div class="info">
            <p><span>Phone:</span> +91 98765 43210</p>
            <p><span>Email:</span> hello@cleanfresh.com</p>
            <p><span>Address:</span> 12 MG Road, Chennai, Tamil Nadu</p>
            <p><span>Hours:</span> Mon - Sat, 9am to 7pm</p>
        </div>
    </div>

</body>

</html>
