<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>404 - Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            background: #111;
            color: #f0f0f0;
        }

        .navbar {
            background: #1a1a1a;
            padding: 15px 30px;
            display: flex;
            gap: 20px;
            align-items: center;
            border-bottom: 2px solid #c9a84c;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #c9a84c;
            margin-right: auto;
        }

        .navbar a {
            color: #c9a84c;
            text-decoration: none;
            font-size: 15px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .content {
            text-align: center;
            margin-top: 100px;
            padding: 20px;
        }

        .content h1 {
            font-size: 80px;
            color: #c9a84c;
        }

        .content p {
            font-size: 18px;
            color: #aaa;
            margin: 15px 0 25px;
        }

        .content a {
            background: #c9a84c;
            color: #111;
            padding: 12px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <!-- navbar -->
    <nav class="navbar">
        <div class="logo"> CleanFresh</div>
        <a href="/home">Home</a>
        <a href="/about">About Us</a>
        <a href="/contact">Contact Us</a>
    </nav>
    <!-- 404 message -->
    <div class="content">
        <h1>404</h1>
        <p>Oops! The page you are looking for does not exist.</p>
        <a href="/home">Go Back Home</a>
    </div>

</body>

</html>
